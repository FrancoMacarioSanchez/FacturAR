<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · FacturAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            overflow: hidden;
        }

        /* Animación de entrada de la tarjeta */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animación de las formas de fondo */
        .animate-blob {
            animation: blob 10s infinite alternate;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        /* Efecto Glassmorphism premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .glass-input {
            background: rgba(15, 23, 42, 0.6); /* slate-900 translúcido */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #6366f1; /* indigo-500 */
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>

<body class="min-h-screen relative flex items-center justify-center p-6 selection:bg-indigo-500 selection:text-white">

    <!-- FONDOS ANIMADOS (Blobs) -->
    <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none">
        <!-- Blob Indigo -->
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
        <!-- Blob Púrpura -->
        <div class="absolute top-[20%] right-[-5%] w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>
        <!-- Blob Azul abajo -->
        <div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <div class="w-full max-w-md relative z-10 fade-in-up">

        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white items-center justify-center text-3xl font-black mb-5 shadow-lg shadow-indigo-500/30 ring-1 ring-white/10">
                F
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">
                FacturAR
            </h1>
            <p class="text-slate-400 mt-2 text-sm">
                Iniciá sesión para gestionar tu negocio
            </p>
        </div>

        <div class="glass-card rounded-3xl p-8">

            {% if form.errors %}
                <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span>Usuario o contraseña incorrectos.</span>
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        Usuario
                    </label>
                    <input
                        type="text"
                        name="username"
                        autocomplete="username"
                        required
                        autofocus
                        placeholder="Ej: admin_sucursal"
                        class="glass-input w-full px-4 py-3.5 rounded-xl outline-none transition-all duration-200 placeholder-slate-600 font-medium"
                    >
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-slate-300">
                            Contraseña
                        </label>
                    </div>
                    <input
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="••••••••"
                        class="glass-input w-full px-4 py-3.5 rounded-xl outline-none transition-all duration-200 placeholder-slate-600 font-medium tracking-widest"
                    >
                </div>

                <div class="pt-2">
                    <button
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-semibold transition-all duration-200 shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] transform hover:-translate-y-0.5"
                    >
                        Ingresar al sistema
                    </button>
                </div>
            </form>

        </div>

        <p class="text-center text-xs text-slate-500 mt-8 font-medium tracking-wide">
            FacturAR · CoreX &copy; {% now "Y" %}
        </p>

    </div>

</body>
</html>
